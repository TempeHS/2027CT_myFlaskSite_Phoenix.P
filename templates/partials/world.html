{% extends 'base.html' %} {% block title %}World Cup - My Flask Site{% endblock
%} {% block content %}

<style>
  /* Hover Zoom Effect */
  .img-hover-zoom {
    transition: transform 0.3s ease;
  }
  .img-hover-zoom:hover {
    transform: scale(1.05);
  }
</style>

<h1 class="text-center mb-5">World Cup tables and stats</h1>

<div class="container">
  <div class="row">
    <!-- LEFT SIDE: WINNERS IMAGE -->
    <div class="col-md-6 mb-4">
      <img
        src="{{ url_for('static', filename='images/winners.jpg') }}"
        class="img-fluid rounded img-hover-zoom"
        alt="World Cup Trophy"
        style="height: auto; object-fit: contain"
      />

      <!-- BUTTON BELOW LEFT IMAGE -->
      <a
        href="https://www.google.com/search?q=fifa+world+cup+standings"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary mt-3 w-100"
      >
        View FIFA World Cup Standings
      </a>
    </div>

    <!-- RIGHT SIDE: STATS IMAGE -->
    <div class="col-md-6 mb-4">
      <img
        src="{{ url_for('static', filename='images/stats.jpg') }}"
        class="img-fluid rounded img-hover-zoom"
        alt="World Cup Stats"
        style="height: auto; object-fit: contain"
      />

      <!-- BUTTON BELOW RIGHT IMAGE -->
      <a
        href="https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026/statistics/team-statistics"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-success mt-3 w-100"
      >
        View Team Statistics
      </a>
    </div>
  </div>
</div>

{% endblock %}
